name: Baseline checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked secrets and local artifacts
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(\.env($|\.)|.*\.(pem|key|p12|pfx)$|__pycache__/|node_modules/)'; then
            echo "Forbidden secret or local artifact is tracked"
            exit 1
          fi
      - name: Validate required baseline files
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f .gitignore
          test -f .editorconfig
          test -f .github/CODEOWNERS
          test -f plans/DOR_DOD.md
          test -f plans/INTEGRATION_RULES.md
